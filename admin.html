<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin - Fun Target</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Arial Black',Arial,sans-serif; user-select:none; }
  body { background:#111; overflow:hidden; }
  .wrap { width:100vw; height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:30px;
    background: radial-gradient(circle at 50% 40%, #2c2c2c 0%, #111 70%); }

  .wheel-wrap { position:relative; }
  .wheel {
    width:380px; height:380px; border-radius:50%;
    border:14px solid #d4af37; outline:4px solid #8b5a00;
    box-shadow:0 0 40px #ffae00, inset 0 0 30px #000;
    position:relative; transition:transform 4s cubic-bezier(.2,.8,.2,1);
    background:conic-gradient(
      #f39c12 0 36deg, #fff 36deg 72deg, #f39c12 72deg 108deg,
      #fff 108deg 144deg, #f39c12 144deg 180deg, #fff 180deg 216deg,
      #f39c12 216deg 252deg, #fff 252deg 288deg, #f39c12 288deg 324deg, #fff 324deg 360deg);
  }
  .num { position:absolute; width:40px; height:40px; left:50%; top:12px;
    margin-left:-20px; color:#c03900; font-weight:bold; font-size:22px;
    text-align:center; line-height:40px; transform-origin:20px 178px; }
  .num.white { color:#fff; text-shadow:1px 1px 2px #000; }
  .hub { position:absolute; top:50%; left:50%; width:110px; height:110px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(#ffe680,#d4af37 60%,#8b5a00);
    border:6px solid #6a3b00; box-shadow:0 0 25px #ffd700;
    display:flex; align-items:center; justify-content:center; }
  .hub span { color:#7a4a00; font-size:26px; }
  .arrow { position:absolute; top:-26px; left:50%; transform:translateX(-50%);
    width:0; height:0; z-index:10;
    border-left:20px solid transparent; border-right:20px solid transparent;
    border-top:40px solid #e74c3c; filter:drop-shadow(0 0 8px #ffd700); }

  .btn { background:linear-gradient(#e74c3c,#922b21); color:#fff; border:4px solid #ffd700;
    border-radius:30px; padding:12px 50px; font-size:22px; cursor:pointer;
    box-shadow:0 0 15px #000; letter-spacing:2px; }
  .btn:hover { filter:brightness(1.25); }
  .btn:disabled { filter:grayscale(0.8); cursor:not-allowed; }
  .logout-btn { background:linear-gradient(#7f8c8d,#2c2c2c) !important;
    border-color:#999 !important; font-size:16px !important; padding:10px 35px !important; }

  .box { text-align:center; }
  .box h2 { color:#fff; font-size:20px; margin-bottom:8px; }
  .display { background:linear-gradient(#fdf6d8,#e8c96a); border:3px solid #b8860b;
    border-radius:10px; color:#5a3a00; font-size:26px; padding:8px 25px; min-width:120px; }
  .history .display { font-size:20px; letter-spacing:6px; min-width:300px; }
  .row { display:flex; gap:40px; align-items:center; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:100;
    display:flex; align-items:center; justify-content:center; }
  .login { background:#1c1c1c; border:3px solid #e74c3c; border-radius:15px;
    padding:40px 50px; text-align:center; color:#fff; box-shadow:0 0 30px #e74c3c; }
  .login h2 { color:#e74c3c; margin-bottom:20px; }
  .login input { display:block; margin:10px auto; padding:10px 15px; width:240px;
    background:#111; border:2px solid #555; border-radius:8px;
    color:#fff; font-size:16px; text-align:center; }
  .login input:focus { border-color:#ffd700; outline:none; }
  .login button { margin-top:10px; padding:10px 30px; cursor:pointer;
    border:2px solid #ffd700; border-radius:20px;
    background:linear-gradient(#e74c3c,#922b21); color:#fff; font-weight:bold; }
  .err { color:#ff6b6b; font-size:13px; min-height:16px; margin-top:8px; }

  .force { text-align:center; }
  .force h2 { color:#27ae60; margin-bottom:6px; font-size:20px; }
  .force p { color:#aaa; font-size:12px; margin-bottom:12px; }
  .nums { display:flex; gap:8px; justify-content:center; }
  .nums button { width:46px; height:46px; font-size:20px; cursor:pointer; color:#fff;
    border-radius:50%; border:3px solid #d4af37;
    background:radial-gradient(circle at 35% 35%, #7ec850, #1e7a1e); }
  .nums button:hover { transform:scale(1.15); filter:brightness(1.3); }
  .info { color:#ffd700; font-size:14px; margin-top:10px; min-height:20px; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="overlay" id="loginScreen">
  <div class="login">
    <h2>🔐 Admin Login</h2>
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="err" id="err"></div>
  </div>
</div>

<!-- ADMIN GAME SCREEN -->
<div class="wrap" id="gameScreen" style="display:none">

  <div class="force">
    <h2>⚙ Force Next Result</h2>
    <p>Click a number — next spin will land on it. Leave empty for random.</p>
    <div class="nums" id="nums"></div>
    <div class="info" id="info">Next spin: RANDOM</div>
  </div>

  <div class="wheel-wrap">
    <div class="arrow"></div>
    <div class="wheel" id="wheel"></div>
    <div class="hub"><span>€€€</span></div>
  </div>

  <button class="btn" id="spinBtn" onclick="spin()">SPIN</button>

  <div class="row">
    <div class="box"><h2>Winner</h2><div class="display" id="winner">-</div></div>
    <div class="box history"><h2>Last 10</h2><div class="display" id="last10">- - - - - - - - - -</div></div>
  </div>

  <button class="btn logout-btn" onclick="logout()">LOGOUT</button>
</div>

<script>
const ADMIN_USER='admin';
const ADMIN_PASS='admin123';

const order=[1,2,3,4,5,6,7,8,9,0];
const wheelEl=document.getElementById('wheel');
order.forEach((n,i)=>{
  const d=document.createElement('div');
  d.className='num'+(i%2?' white':'');
  d.style.transform=`rotate(${i*36}deg)`;
  d.textContent=n;
  wheelEl.appendChild(d);
});

const numsEl=document.getElementById('nums');
for(let n=0;n<=9;n++){
  const b=document.createElement('button');
  b.textContent=n;
  b.onclick=()=>{ forced=n; document.getElementById('info').textContent=`✔ Next spin will land on ${n}`; };
  numsEl.appendChild(b);
}

let loggedIn=false, spinning=false, rotation=0, forced=null;
let history=[];

function login(){
  if(document.getElementById('user').value===ADMIN_USER &&
     document.getElementById('pass').value===ADMIN_PASS){
    loggedIn=true;
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('gameScreen').style.display='flex';
    // Game is running — players see "WAITING FOR ADMIN"
    localStorage.setItem('ft_status','running');
    // Restore history (fresh login starts empty)
    history=[];
    document.getElementById('last10').textContent='- - - - - - - - - -';
  } else {
    document.getElementById('err').textContent='Wrong username or password!';
  }
}

function logout(){
  if(spinning){ alert('Wait for the spin to finish!'); return; }
  loggedIn=false;
  forced=null;
  // Reset everything
  history=[];
  rotation=0;
  document.getElementById('last10').textContent='- - - - - - - - - -';
  document.getElementById('winner').textContent='-';
  document.getElementById('info').textContent='Next spin: RANDOM';
  // Tell player pages: GAME END + clear history
  localStorage.setItem('ft_status','ended');
  localStorage.setItem('ft_history', JSON.stringify([]));
  // Show login again
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('err').textContent='';
  document.getElementById('user').value='';
  document.getElementById('pass').value='';
}

function spin(){
  if(spinning) return;
  spinning=true;
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('winner').textContent='-';

  const result=(forced!==null)?forced:Math.floor(Math.random()*10);
  forced=null;
  document.getElementById('info').textContent='Next spin: RANDOM';

  const idx=order.indexOf(result);
  const neededMod=(360-(idx*36))%360;
  const currentMod=((rotation%360)+360)%360;
  const add=(neededMod-currentMod+360)%360;
  rotation+=1440+add;
  wheelEl.style.transform=`rotate(${rotation}deg)`;

  localStorage.setItem('ft_spin', JSON.stringify({result, time:Date.now()}));

  setTimeout(()=>{
    document.getElementById('winner').textContent=result;
    history.unshift(result);
    if(history.length>10) history.pop();
    document.getElementById('last10').textContent=history.join(' ');
    localStorage.setItem('ft_history', JSON.stringify(history));
    spinning=false;
    document.getElementById('spinBtn').disabled=false;
  },4200);
}
</script>
</body>
</html>
