<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin - Fun Target</title>
<link rel="stylesheet" href="scene.css">
<style>
.sound-toggle-btn {
  position: fixed;
  top: 16px;
  right: 18px;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  background: linear-gradient(180deg, #2a1402 0%, #150900 100%);
  border: 2px solid #ffd700;
  border-radius: 24px;
  color: #ffe890;
  font-size: 15px;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 0 16px rgba(255, 215, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
}
.sound-toggle-btn.muted {
  background: linear-gradient(180deg, #222 0%, #111 100%);
  border-color: #666;
  color: #888;
  box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
<!-- LOGIN SCREEN -->
<div class="overlay" id="loginScreen">
  <div class="login">
    <h2>🔐 Admin Login</h2>
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="gameScreen" style="display:none"><div class="scene" id="scene" data-h="788" style="height:788px">
<div class="bandclip"><div class="tilt"><div class="wheel" id="wheel"></div></div></div>
<div class="ttl" style="left:22px;width:335px;top:32px">Next Spin</div>
<div class="val mid" id="info" style="left:22px;top:86px;font-size:19px">Next spin: RANDOM</div>
<div class="ttl" style="left:22px;width:335px;top:330px">Timer</div>
<div class="val timer" id="timer" style="left:22px;top:375px">--:--</div>
<div class="val" id="winner" style="left:1285px;top:86px">-</div>
<div class="val sm" id="last10" style="left:1285px;top:263px">- - - - - - - - - -</div>
<div class="foot"><div class="ftitle">⚙ Force Next Result</div><div class="nums" id="nums"></div>
<button class="btn logout-btn" style="left:30px;top:6px" onclick="logout()">LOGOUT</button>
<button class="btn" id="spinBtn" style="left:1310px;top:2px" onclick="spin()">SPIN</button></div>
</div></div>
<button id="adminSoundToggleBtn" class="sound-toggle-btn" type="button" aria-label="Toggle admin sound" onclick="toggleAdminSound(event)">
  <span id="adminSoundIcon">🔊</span>
  <span id="adminSoundLabel">SOUND: ON</span>
</button>
<script>
const ADMIN_USER='admin';
const ADMIN_PASS='admin';

const firebaseConfig={
  apiKey:"AIzaSyChx7rQNNVsmd5QCof-mXZU6OT5KoZrFDg",
  authDomain:"funtarget.firebaseapp.com",
  databaseURL:"https://funtarget-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"funtarget",
  storageBucket:"funtarget.firebasestorage.app",
  messagingSenderId:"905081850251",
  appId:"1:905081850251:web:05a811f49d7f420b09078e"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const roomId=new URLSearchParams(location.search).get('topic')||'spin';
const room=db.ref('rooms/'+roomId);
const adminSessionRef=room.child('adminSession');

const order=[1,2,3,4,5,6,7,8,9,0];
const wheelEl=document.getElementById('wheel');
order.forEach((n,i)=>{
  const d=document.createElement('div');
  d.className='num'+(i%2?' white':'');
  d.style.transform=`rotate(${i*36}deg)`;
  d.textContent=n;
  wheelEl.appendChild(d);
});

const numsEl=document.getElementById('nums');
for(let n=0;n<=9;n++){
  const b=document.createElement('button');
  b.type='button';
  b.textContent=n;
  b.setAttribute('aria-pressed','false');
  b.onclick=async()=>{
    if(!loggedIn || !adminSessionToken) return;
    clearForcedSelection();
    forced=n;
    b.classList.add('selected');
    b.setAttribute('aria-pressed','true');
    document.getElementById('info').textContent=`✔ Next spin will land on ${n}`;
    try{
      await room.update({forcedResult:n});
    }catch(error){
      showFirebaseError(error);
    }
  };
  numsEl.appendChild(b);
}

let loggedIn=false, spinning=false, rotation=0, forced=null;
let countdownInterval=null, nextSpinAt=0, spinTimeout=null;
let activeLogoutVersion=0;
let adminSessionToken=null;
let history=[];

const SPIN_DURATION_SEC=16.2;
const SPIN_DURATION_MS=16200;
const AUDIO_FILE='roulette.mp3';
const spinAudio=new Audio(AUDIO_FILE);
spinAudio.preload='auto';
let adminSoundMuted=localStorage.getItem('ft_admin_sound_muted')==='true';
spinAudio.muted=adminSoundMuted;
spinAudio.addEventListener('error',()=>{
  spinAudio.src='Roulette Wheel (No Copyright) %23roulette %23casino %23gambling.mp3';
});

let audioUnlocked=false;
function unlockAudio(){
  if(audioUnlocked || adminSoundMuted) return;
  audioUnlocked=true;
  spinAudio.play().then(()=>{
    spinAudio.pause();
    spinAudio.currentTime=0;
  }).catch(()=>{});
}
['click','keydown','pointerdown','touchstart'].forEach(evt=>{
  window.addEventListener(evt,unlockAudio,{once:true,passive:true});
});

function updateAdminSoundButton(){
  const button=document.getElementById('adminSoundToggleBtn');
  document.getElementById('adminSoundIcon').textContent=adminSoundMuted?'🔇':'🔊';
  document.getElementById('adminSoundLabel').textContent=adminSoundMuted?'SOUND: OFF':'SOUND: ON';
  button.classList.toggle('muted',adminSoundMuted);
  button.setAttribute('aria-pressed',String(!adminSoundMuted));
}

function toggleAdminSound(event){
  if(event) event.stopPropagation();
  adminSoundMuted=!adminSoundMuted;
  localStorage.setItem('ft_admin_sound_muted',String(adminSoundMuted));
  spinAudio.muted=adminSoundMuted;
  updateAdminSoundButton();
  if(adminSoundMuted){
    spinAudio.pause();
  }else if(spinning){
    spinAudio.play().catch(()=>{});
  }
  unlockAudio();
}

function showFirebaseError(error){
  console.error('Firebase error:',error);
  document.getElementById('info').textContent='Online connection error. Check database access.';
}

room.child('logoutVersion').on('value',snapshot=>{
  const version=Number(snapshot.val())||0;
  if(loggedIn && version!==activeLogoutVersion){
    activeLogoutVersion=version;
    resetAdminSession();
  }
},showFirebaseError);

adminSessionRef.on('value',snapshot=>{
  if(loggedIn && snapshot.val()!==adminSessionToken){
    resetAdminSession('This admin panel was signed in elsewhere. You have been logged out.');
  }
},showFirebaseError);

function clearForcedSelection(){
  const selectedButton=numsEl.querySelector('.selected');
  if(selectedButton){
    selectedButton.classList.remove('selected');
    selectedButton.setAttribute('aria-pressed','false');
  }
}

function normalizeHistory(value){
  if(Array.isArray(value)) return value.map(Number).filter(Number.isInteger).slice(0,10);
  if(typeof value==='string') return value.trim().split(/\s+/).map(Number).filter(Number.isInteger).slice(0,10);
  if(value && typeof value==='object') return Object.values(value).map(Number).filter(Number.isInteger).slice(0,10);
  return [];
}

function updateCountdown(){
  const timerEl=document.getElementById('timer');
  if(!nextSpinAt){
    timerEl.textContent='--:--';
    return;
  }
  const seconds=Math.max(0,Math.ceil((nextSpinAt-Date.now())/1000));
  timerEl.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
  if(seconds===0 && loggedIn && !spinning){
    clearInterval(countdownInterval);
    countdownInterval=null;
    spin();
  }
}

function startCountdown(timestamp){
  nextSpinAt=Number(timestamp)||0;
  if(countdownInterval) clearInterval(countdownInterval);
  updateCountdown();
  countdownInterval=nextSpinAt ? setInterval(updateCountdown,250) : null;
}

async function login(){
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value.trim();
  if(u==='admin' && (p==='admin' || p==='admin123')){
    const errorEl=document.getElementById('err');
    errorEl.textContent='Connecting...';
    let sessionToken=null;
    try{
      sessionToken=db.ref().push().key;
      const claim=await adminSessionRef.transaction(current=>current===null?sessionToken:undefined);
      if(!claim.committed){
        errorEl.textContent='Another device is already controlling the admin panel. Try again after it logs out.';
        return;
      }
      adminSessionToken=sessionToken;
      await adminSessionRef.onDisconnect().remove();
      const snapshot=await room.once('value');
      const data=snapshot.val()||{};
      history=normalizeHistory(data.history);
      activeLogoutVersion=Number(data.logoutVersion)||0;
      const deadline=Date.now()+60000;
      await room.update({
        state:'running',
        winner:data.winner||'-',
        history,
        nextSpinAt:deadline,
        spinId:Number(data.spinId)||0,
        forcedResult:null
      });
      loggedIn=true;
      document.getElementById('last10').textContent=history.join(' ')||'- - - - - - - - - -';
      document.getElementById('winner').textContent=data.winner||'-';
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('gameScreen').style.display='flex';
      document.getElementById('info').textContent='Next spin: RANDOM';
      startCountdown(deadline);
    }catch(error){
      console.error('Firebase login/read error:',error);
      if(sessionToken && adminSessionToken===sessionToken){
        try{
          await adminSessionRef.onDisconnect().cancel();
          await adminSessionRef.transaction(current=>current===sessionToken?null:undefined);
        }catch(cleanupError){
          console.error('Could not release the admin session after login failed:',cleanupError);
        }
        adminSessionToken=null;
      }
      errorEl.textContent='Could not connect to online game. Check Firebase database rules.';
    }
  } else {
    document.getElementById('err').textContent='Wrong username or password!';
  }
}

function resetAdminSession(message=''){
  loggedIn=false;
  adminSessionToken=null;
  spinning=false;
  forced=null;
  rotation=0;
  history=[];
  if(countdownInterval) clearInterval(countdownInterval);
  countdownInterval=null;
  nextSpinAt=0;
  if(spinTimeout) clearTimeout(spinTimeout);
  spinTimeout=null;
  spinAudio.pause();
  spinAudio.currentTime=0;
  wheelEl.style.transition='none';
  wheelEl.style.transform='rotate(0deg)';
  clearForcedSelection();
  document.getElementById('spinBtn').disabled=false;
  document.getElementById('timer').textContent='--:--';
  document.getElementById('last10').textContent='- - - - - - - - - -';
  document.getElementById('winner').textContent='-';
  document.getElementById('info').textContent='Next spin: RANDOM';
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('err').textContent=message;
  document.getElementById('user').value='';
  document.getElementById('pass').value='';
}

async function logout(){
  if(spinning){ alert('Wait for the spin to finish!'); return; }
  const sessionToken=adminSessionToken;
  try{
    const snapshot=await adminSessionRef.once('value');
    if(snapshot.val()!==sessionToken){
      resetAdminSession('This admin session is no longer active.');
      return;
    }
    await room.update({
      state:'ended',
      nextSpinAt:null,
      winner:'-',
      history:[],
      logoutVersion:activeLogoutVersion+1,
      forcedResult:null
    });
    await adminSessionRef.onDisconnect().cancel();
    const released=await adminSessionRef.transaction(current=>current===sessionToken?null:undefined);
    if(!released.committed){
      resetAdminSession('This admin session is no longer active.');
      return;
    }
  }catch(error){
    try{
      if(sessionToken) await adminSessionRef.onDisconnect().remove();
    }catch(restoreError){
      console.error('Could not restore admin disconnect cleanup:',restoreError);
    }
    showFirebaseError(error);
    return;
  }
  resetAdminSession();
}

async function spin(){
  if(spinning || !loggedIn || !adminSessionToken) return;
  spinning=true;
  if(countdownInterval) clearInterval(countdownInterval);
  countdownInterval=null;
  document.getElementById('timer').textContent='00:00';
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('winner').textContent='-';

  const result=(forced!==null)?forced:Math.floor(Math.random()*10);
  const spinId=Date.now();
  forced=null;
  clearForcedSelection();
  document.getElementById('info').textContent='Next spin: RANDOM';

  try{
    const snapshot=await adminSessionRef.once('value');
    if(snapshot.val()!==adminSessionToken){
      resetAdminSession('This admin session is no longer active.');
      return;
    }
    await room.update({state:'spin',result,spinId,nextSpinAt:null,forcedResult:null});
  }catch(error){
    spinning=false;
    document.getElementById('spinBtn').disabled=false;
    showFirebaseError(error);
    return;
  }

  const idx=order.indexOf(result);
  const neededMod=(360-(idx*36))%360;
  const currentMod=((rotation%360)+360)%360;
  const add=(neededMod-currentMod+360)%360;

  // Play audio in admin panel synchronized with spin
  try{
    spinAudio.currentTime=0;
    const playPromise=spinAudio.play();
    if(playPromise!==undefined){
      playPromise.catch(()=>{});
    }
  }catch(e){}

  rotation+=5040+add;
  wheelEl.style.transition=`transform ${SPIN_DURATION_SEC}s cubic-bezier(0.15, 0.85, 0.2, 1)`;
  wheelEl.style.transform=`rotate(${rotation}deg)`;

  spinTimeout=setTimeout(async()=>{
    spinTimeout=null;
    const updatedHistory=[result,...history].slice(0,10);
    const deadline=Date.now()+60000;
    try{
      const snapshot=await adminSessionRef.once('value');
      if(snapshot.val()!==adminSessionToken){
        resetAdminSession('This admin session is no longer active.');
        return;
      }
      await room.update({
        state:'running',
        result,
        winner:String(result),
        history:updatedHistory,
        spinId,
        nextSpinAt:deadline
      });
    }catch(error){
      spinning=false;
      document.getElementById('spinBtn').disabled=false;
      showFirebaseError(error);
      return;
    }
    document.getElementById('winner').textContent=result;
    history=updatedHistory;
    document.getElementById('last10').textContent=history.join(' ');
    spinning=false;
    document.getElementById('spinBtn').disabled=false;
    if(loggedIn) startCountdown(deadline);
  }, SPIN_DURATION_MS);
}
updateAdminSoundButton();
</script>
<script src="scene.js"></script>
</body>
</html>
